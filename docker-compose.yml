services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: fullprojectstudio
      POSTGRES_USER: fullprojectstudio
      POSTGRES_PASSWORD: fullprojectstudio
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  # Backup automatico del database PostgreSQL (disaster recovery vero,
  # distinto dal backup Excel: qui c'è tutto il database, ripristinabile
  # integralmente in caso di perdita totale del volume db-data).
  db-backup:
    image: prodrigestivill/postgres-backup-local:16
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: fullprojectstudio
      POSTGRES_USER: fullprojectstudio
      POSTGRES_PASSWORD: fullprojectstudio
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 6
    volumes:
      - ./backup/postgres:/backups
    depends_on:
      - db

  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://db:5432/fullprojectstudio
      DB_USERNAME: fullprojectstudio
      DB_PASSWORD: fullprojectstudio
      CORS_ALLOWED_ORIGINS: http://localhost:8081
      JWT_SECRET: ${JWT_SECRET:-cambiaQuestaChiaveSegretaInProduzioneFullProjectStudio2026!}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-FullProject2026!}
      SEGRETERIA_USERNAME: ${SEGRETERIA_USERNAME:-segreteria}
      SEGRETERIA_PASSWORD: ${SEGRETERIA_PASSWORD:-Segreteria2026!}
      BACKUP_DIR: /app/backup
      BACKUP_CRON: ${BACKUP_CRON:-0 0 2 * * *}
    volumes:
      # Cartella reale sul PC host: qui atterrano i file Excel di backup,
      # consultabili anche se il gestionale non fosse raggiungibile.
      - ./backup:/app/backup
    depends_on:
      - db
    ports:
      - "8080:8080"

  # Il frontend è statico (HTML/CSS/JS): il browser chiama il backend direttamente.
  # API_BASE_URL deve puntare a dove il backend è raggiungibile dal browser
  # dell'utente (non dalla rete interna Docker) — qui: http://localhost:8080.
  # In produzione (es. Railway) sarà l'URL pubblico del servizio backend.
  frontend:
    build: ./frontend
    environment:
      API_BASE_URL: ${API_BASE_URL:-http://localhost:8080}
    depends_on:
      - backend
    ports:
      - "8081:8081"

volumes:
  db-data:
