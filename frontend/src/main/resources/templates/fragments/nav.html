<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<nav class="navbar" th:fragment="nav(active)">
    <div class="brand">
        <span>FullProject</span><span class="accent">Studio</span>

    <div class="nav-links">
