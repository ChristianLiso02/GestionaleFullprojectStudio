<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${nomeScuola} + ' - Sale'">Sale</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: nav('sale')}"></div>
<div class="container">
    <div class="page-header">
        <h1>Sale</h1>
        <a class="btn btn-primary" th:href="@{/sale/nuova}">+ Nuova sala</a>
    </div>
    <div class="card">
        <table th:if="${not #lists.isEmpty(sale)}">
            <thead><tr><th>Nome</th><th>Capienza</th><th>Note</th><th></th></tr></thead>
            <tbody>
            <tr th:each="s : ${sale}">
                <td th:text="${s.nome}"></td>
                <td th:text="${s.capienza}"></td>
                <td th:text="${s.note}"></td>
                <td class="actions-cell">
                    <a class="btn btn-dark btn-sm" th:href="@{/sale/{id}/modifica(id=${s.id})}">Modifica</a>
                    <form th:action="@{/sale/{id}/elimina(id=${s.id})}" method="post" onsubmit="return confirm('Eliminare questa sala?');">
                        <button type="submit" class="btn btn-primary btn-sm">Elimina</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
        <div class="empty-state" th:if="${#lists.isEmpty(sale)}">Nessuna sala registrata.</div>
    </div>
</div>
</body>
</html>
