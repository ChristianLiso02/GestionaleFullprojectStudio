<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${nomeScuola} + ' - Presenze'">Presenze</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: nav('presenze')}"></div>
<div class="container">
    <div class="page-header">
        <h1>Registro presenze</h1>
    </div>

    <form class="card" th:action="@{/presenze}" method="get" style="display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap">
        <div class="form-group" style="margin-bottom:0">
            <label>Corso</label>
            <select name="corsoId" onchange="this.form.submit()">
                <option value="">-- seleziona un corso --</option>
                <option th:each="c : ${corsi}" th:value="${c.id}" th:selected="${c.id == corsoId}" th:text="${c.nome}"></option>
            </select>
        </div>
        <div class="form-group" style="margin-bottom:0">
            <label>Data lezione</label>
            <input type="date" name="data" th:value="${data}" onchange="this.form.submit()">
        </div>
        <button type="submit" class="btn btn-outline">Aggiorna</button>
    </form>

    <div class="card" th:if="${corsoId != null}">
        <table th:if="${not #lists.isEmpty(iscritti)}">
            <thead><tr><th>Studente</th><th>Presente</th></tr></thead>
            <tbody>
            <tr th:each="i : ${iscritti}">
                <td th:text="${i.studenteNomeCompleto}"></td>
                <td>
                    <form th:action="@{/presenze/registra}" method="post" style="display:flex;gap:8px;align-items:center">
                        <input type="hidden" name="iscrizioneId" th:value="${i.id}">
                        <input type="hidden" name="corsoId" th:value="${corsoId}">
                        <input type="hidden" name="data" th:value="${data}">
                        <input type="checkbox" name="presente" value="true" style="width:auto"
                               th:checked="${presenzePerIscrizione.get(i.id) != null and presenzePerIscrizione.get(i.id).presente}"
                               onchange="this.form.submit()">
                        <input type="hidden" name="presente" value="false">
                        <span th:if="${presenzePerIscrizione.get(i.id) == null}" style="color:#999;font-size:0.8rem">non ancora registrato</span>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
        <div class="empty-state" th:if="${#lists.isEmpty(iscritti)}">Nessuno studente iscritto a questo corso.</div>
    </div>
    <div class="empty-state card" th:if="${corsoId == null}">Seleziona un corso per registrare le presenze.</div>
</div>
</body>
</html>
