<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${nomeScuola} + ' - Istruttore'">Istruttore</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: nav('istruttori')}"></div>
<div class="container">
    <div class="page-header">
        <h1 th:text="${istruttore.id} != null ? 'Modifica istruttore' : 'Nuovo istruttore'">Istruttore</h1>
    </div>
    <div class="card">
        <form th:action="@{/istruttori/salva}" th:object="${istruttore}" method="post">
            <input type="hidden" th:field="*{id}">
            <div class="detail-grid">
                <div class="form-group">
                    <label>Nome</label>
                    <input type="text" th:field="*{nome}" required>
                </div>
                <div class="form-group">
                    <label>Cognome</label>
                    <input type="text" th:field="*{cognome}" required>
                </div>
                <div class="form-group">
                    <label>Telefono</label>
                    <input type="text" th:field="*{telefono}">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" th:field="*{email}">
                </div>
                <div class="form-group">
                    <label>Compenso orario (€)</label>
                    <input type="number" step="0.01" th:field="*{compensoOrario}">
                </div>
            </div>
            <div class="form-group">
                <label>Specializzazioni</label>
                <div class="checkbox-list">
                    <label th:each="stile : ${stiliBallo}">
                        <input type="checkbox" name="specializzazioni" th:value="${stile}" th:checked="${istruttore.specializzazioni != null and istruttore.specializzazioni.contains(stile)}">
                        <span th:text="${stile}"></span>
                    </label>
                </div>
            </div>
            <div class="form-group">
                <label><input type="checkbox" th:field="*{attivo}" style="width:auto;display:inline-block"> Istruttore attivo</label>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Salva</button>
                <a class="btn btn-outline" th:href="@{/istruttori}">Annulla</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
