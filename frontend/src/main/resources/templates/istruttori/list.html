<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${nomeScuola} + ' - Istruttori'">Istruttori</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: nav('istruttori')}"></div>
<div class="container">
    <div class="page-header">
        <h1>Istruttori</h1>
        <a class="btn btn-primary" th:href="@{/istruttori/nuovo}">+ Nuovo istruttore</a>
    </div>
    <div class="card">
        <table th:if="${not #lists.isEmpty(istruttori)}">
            <thead>
            <tr><th>Nome</th><th>Cognome</th><th>Telefono</th><th>Email</th><th>Specializzazioni</th><th>Stato</th><th></th></tr>
            </thead>
            <tbody>
            <tr th:each="i : ${istruttori}">
                <td th:text="${i.nome}"></td>
                <td th:text="${i.cognome}"></td>
                <td th:text="${i.telefono}"></td>
                <td th:text="${i.email}"></td>
                <td th:text="${#strings.listJoin(i.specializzazioni, ', ')}"></td>
                <td><span class="badge" th:classappend="${i.attivo} ? 'badge-attivo' : 'badge-inattivo'" th:text="${i.attivo} ? 'Attivo' : 'Inattivo'"></span></td>
                <td class="actions-cell">
                    <a class="btn btn-dark btn-sm" th:href="@{/istruttori/{id}/modifica(id=${i.id})}">Modifica</a>
                    <form th:action="@{/istruttori/{id}/elimina(id=${i.id})}" method="post" onsubmit="return confirm('Eliminare questo istruttore?');">
                        <button type="submit" class="btn btn-primary btn-sm">Elimina</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
        <div class="empty-state" th:if="${#lists.isEmpty(istruttori)}">Nessun istruttore registrato.</div>
    </div>
</div>
</body>
</html>
