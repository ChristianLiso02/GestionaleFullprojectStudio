<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${nomeScuola} + ' - Iscrizioni'">Iscrizioni</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: nav('iscrizioni')}"></div>
<div class="container">
    <div class="page-header">
        <h1>Iscrizioni</h1>
        <a class="btn btn-primary" th:href="@{/iscrizioni/nuova}">+ Nuova iscrizione</a>
    </div>
    <div class="card">
        <table th:if="${not #lists.isEmpty(iscrizioni)}">
            <thead>
            <tr><th>Studente</th><th>Corso</th><th>Abbonamento</th><th>Dal</th><th>Scadenza</th><th>Stato</th><th></th></tr>
            </thead>
            <tbody>
            <tr th:each="i : ${iscrizioni}">
                <td th:text="${i.studenteNomeCompleto}"></td>
                <td th:text="${i.corsoNome}"></td>
                <td th:text="${i.tipoAbbonamentoNome} ?: '-'"></td>
                <td th:text="${#temporals.format(i.dataIscrizione, 'dd/MM/yyyy')}"></td>
                <td th:text="${i.dataScadenza} != null ? ${#temporals.format(i.dataScadenza, 'dd/MM/yyyy')} : '-'"></td>
                <td><span class="badge" th:classappend="'badge-' + ${#strings.toLowerCase(i.stato)}" th:text="${i.stato}"></span></td>
                <td class="actions-cell">
                    <a class="btn btn-dark btn-sm" th:href="@{/iscrizioni/{id}/modifica(id=${i.id})}">Modifica</a>
                    <form th:action="@{/iscrizioni/{id}/elimina(id=${i.id})}" method="post" onsubmit="return confirm('Eliminare questa iscrizione?');">
                        <button type="submit" class="btn btn-primary btn-sm">Elimina</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
        <div class="empty-state" th:if="${#lists.isEmpty(iscrizioni)}">Nessuna iscrizione registrata.</div>
    </div>
</div>
</body>
</html>
