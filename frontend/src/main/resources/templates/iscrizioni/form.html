<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${nomeScuola} + ' - Iscrizione'">Iscrizione</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: nav('iscrizioni')}"></div>
<div class="container">
    <div class="page-header">
        <h1 th:text="${iscrizione.id} != null ? 'Modifica iscrizione' : 'Nuova iscrizione'">Iscrizione</h1>
    </div>
    <div class="card">
        <form th:action="@{/iscrizioni/salva}" th:object="${iscrizione}" method="post">
            <input type="hidden" th:field="*{id}">
            <div class="detail-grid">
                <div class="form-group">
                    <label>Studente</label>
                    <select th:field="*{studenteId}" required>
                        <option value="">-- seleziona --</option>
                        <option th:each="s : ${studenti}" th:value="${s.id}" th:text="${s.nome + ' ' + s.cognome}"></option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Corso</label>
                    <select th:field="*{corsoId}" required>
                        <option value="">-- seleziona --</option>
                        <option th:each="c : ${corsi}" th:value="${c.id}" th:text="${c.nome}"></option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Tipo abbonamento</label>
                    <select th:field="*{tipoAbbonamentoId}">
                        <option value="">-- nessuno --</option>
                        <option th:each="a : ${tipiAbbonamento}" th:value="${a.id}" th:text="${a.nome}"></option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Data iscrizione</label>
                    <input type="date" th:field="*{dataIscrizione}">
                </div>
                <div class="form-group">
                    <label>Data scadenza</label>
                    <input type="date" th:field="*{dataScadenza}">
                    <small>Se lasciata vuota e l'abbonamento ha una durata, viene calcolata automaticamente.</small>
                </div>
                <div class="form-group">
                    <label>Stato</label>
                    <select th:field="*{stato}">
                        <option th:each="st : ${statiIscrizione}" th:value="${st}" th:text="${st}"></option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label>Note</label>
                <textarea th:field="*{note}" rows="3"></textarea>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Salva</button>
                <a class="btn btn-outline" th:href="@{/iscrizioni}">Annulla</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
