<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${nomeScuola} + ' - Dashboard'">Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: nav('dashboard')}"></div>
<div class="container">
    <div class="page-header">
        <h1>Dashboard</h1>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <div class="value" th:text="${stats.studentiAttivi}">0</div>
            <div class="label">Studenti attivi</div>
        </div>
        <div class="stat-card">
            <div class="value" th:text="${stats.corsiAttivi}">0</div>
            <div class="label">Corsi attivi</div>
        </div>
        <div class="stat-card">
            <div class="value" th:text="${stats.iscrizioniAttive}">0</div>
            <div class="label">Iscrizioni attive</div>
        </div>
        <div class="stat-card">
            <div class="value" th:text="${'€ ' + #numbers.formatDecimal(stats.incassiMeseCorrente, 1, 2)}">€ 0,00</div>
            <div class="label">Incassi mese corrente</div>
        </div>
        <div class="stat-card">
            <div class="value" th:text="${stats.pagamentiInSospeso}">0</div>
            <div class="label">Pagamenti in sospeso</div>
        </div>
    </div>

    <div class="card">
        <h2 style="margin-top:0">Iscrizioni in scadenza (prossimi 30 giorni)</h2>
        <table th:if="${not #lists.isEmpty(stats.iscrizioniInScadenza)}">
            <thead>
            <tr>
                <th>Studente</th>
                <th>Corso</th>
                <th>Scadenza</th>
                <th>Stato</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="i : ${stats.iscrizioniInScadenza}">
                <td th:text="${i.studenteNomeCompleto}"></td>
                <td th:text="${i.corsoNome}"></td>
                <td th:text="${#temporals.format(i.dataScadenza, 'dd/MM/yyyy')}"></td>
                <td><span class="badge badge-attiva" th:text="${i.stato}"></span></td>
            </tr>
            </tbody>
        </table>
        <div class="empty-state" th:if="${#lists.isEmpty(stats.iscrizioniInScadenza)}">
            Nessuna iscrizione in scadenza nei prossimi 30 giorni.
        </div>
    </div>
</div>
</body>
</html>
