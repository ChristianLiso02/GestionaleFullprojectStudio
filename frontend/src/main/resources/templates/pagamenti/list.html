<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${nomeScuola} + ' - Pagamenti'">Pagamenti</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: nav('pagamenti')}"></div>
<div class="container">
    <div class="page-header">
        <h1>Pagamenti</h1>
        <a class="btn btn-primary" th:href="@{/pagamenti/nuovo}">+ Nuovo pagamento</a>
    </div>
    <div class="card">
        <table th:if="${not #lists.isEmpty(pagamenti)}">
            <thead>
            <tr><th>Studente</th><th>Data</th><th>Importo</th><th>Metodo</th><th>Causale</th><th>Stato</th><th></th></tr>
            </thead>
            <tbody>
            <tr th:each="p : ${pagamenti}">
                <td th:text="${p.studenteNomeCompleto}"></td>
                <td th:text="${#temporals.format(p.dataPagamento, 'dd/MM/yyyy')}"></td>
                <td th:text="${'€ ' + #numbers.formatDecimal(p.importo, 1, 2)}"></td>
                <td th:text="${p.metodo}"></td>
                <td th:text="${p.causale}"></td>
                <td><span class="badge" th:classappend="'badge-' + ${#strings.toLowerCase(p.stato)}" th:text="${p.stato}"></span></td>
                <td class="actions-cell">
                    <a class="btn btn-dark btn-sm" th:href="@{/pagamenti/{id}/modifica(id=${p.id})}">Modifica</a>
                    <form th:action="@{/pagamenti/{id}/elimina(id=${p.id})}" method="post" onsubmit="return confirm('Eliminare questo pagamento?');">
                        <button type="submit" class="btn btn-primary btn-sm">Elimina</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
        <div class="empty-state" th:if="${#lists.isEmpty(pagamenti)}">Nessun pagamento registrato.</div>
    </div>
</div>
</body>
</html>
