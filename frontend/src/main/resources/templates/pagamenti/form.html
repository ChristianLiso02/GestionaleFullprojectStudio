<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${nomeScuola} + ' - Pagamento'">Pagamento</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: nav('pagamenti')}"></div>
<div class="container">
    <div class="page-header">
        <h1 th:text="${pagamento.id} != null ? 'Modifica pagamento' : 'Nuovo pagamento'">Pagamento</h1>
    </div>
    <div class="card">
        <form th:action="@{/pagamenti/salva}" th:object="${pagamento}" method="post">
            <input type="hidden" th:field="*{id}">
            <div class="detail-grid">
                <div class="form-group">
                    <label>Studente</label>
                    <select th:field="*{studenteId}" required>
                        <option value="">-- seleziona --</option>
                        <option th:each="s : ${studenti}" th:value="${s.id}" th:text="${s.nome + ' ' + s.cognome}"></option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Iscrizione collegata</label>
                    <select th:field="*{iscrizioneId}">
                        <option value="">-- nessuna --</option>
                        <option th:each="i : ${iscrizioni}" th:value="${i.id}" th:text="${i.studenteNomeCompleto + ' - ' + i.corsoNome}"></option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Importo (€)</label>
                    <input type="number" step="0.01" th:field="*{importo}" required>
                </div>
                <div class="form-group">
                    <label>Data pagamento</label>
                    <input type="date" th:field="*{dataPagamento}">
                </div>
                <div class="form-group">
                    <label>Metodo</label>
                    <select th:field="*{metodo}" required>
                        <option th:each="m : ${metodiPagamento}" th:value="${m}" th:text="${m}"></option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Stato</label>
                    <select th:field="*{stato}">
                        <option th:each="st : ${statiPagamento}" th:value="${st}" th:text="${st}"></option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Causale</label>
                    <input type="text" th:field="*{causale}" placeholder="es. Quota mensile Salsa Cubana">
                </div>
            </div>
            <div class="form-group">
                <label>Note</label>
                <textarea th:field="*{note}" rows="3"></textarea>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Salva</button>
                <a class="btn btn-outline" th:href="@{/pagamenti}">Annulla</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
