<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${nomeScuola} + ' - Abbonamento'">Abbonamento</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: nav('abbonamenti')}"></div>
<div class="container">
    <div class="page-header">
        <h1 th:text="${abbonamento.id} != null ? 'Modifica abbonamento' : 'Nuovo abbonamento'">Abbonamento</h1>
    </div>
    <div class="card">
        <form th:action="@{/abbonamenti/salva}" th:object="${abbonamento}" method="post">
            <input type="hidden" th:field="*{id}">
            <div class="detail-grid">
                <div class="form-group">
                    <label>Nome</label>
                    <input type="text" th:field="*{nome}" required>
                </div>
                <div class="form-group">
                    <label>Prezzo (€)</label>
                    <input type="number" step="0.01" th:field="*{prezzo}" required>
                </div>
                <div class="form-group">
                    <label>Durata (giorni)</label>
                    <input type="number" th:field="*{durataGiorni}" placeholder="es. 30">
                </div>
                <div class="form-group">
                    <label>Numero lezioni (in alternativa alla durata)</label>
                    <input type="number" th:field="*{numeroLezioni}" placeholder="es. 10">
                </div>
            </div>
            <div class="form-group">
                <label>Descrizione</label>
                <textarea th:field="*{descrizione}" rows="3"></textarea>
            </div>
            <div class="form-group">
                <label><input type="checkbox" th:field="*{attivo}" style="width:auto;display:inline-block"> Abbonamento attivo</label>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Salva</button>
                <a class="btn btn-outline" th:href="@{/abbonamenti}">Annulla</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
