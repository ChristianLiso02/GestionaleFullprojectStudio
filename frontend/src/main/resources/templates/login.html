<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${nomeScuola} + ' - Accesso'">FullProject Studio</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="login-wrapper">
    <div class="login-card">
        <h1><span style="color:#111">FullProject</span><span style="color:#c1121f">Studio</span></h1>
        <p class="subtitle">Gestionale interno &mdash; area segreteria</p>

        <div class="error-message" th:if="${errore}" th:text="${errore}"></div>
        <div class="error-message" th:if="${param.scaduto}">Sessione scaduta, effettua nuovamente l'accesso.</div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label for="username">Nome utente</label>
                <input type="text" id="username" name="username" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%">Accedi</button>
        </form>
    </div>
</div>
</body>
</html>
