<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${nomeScuola} + ' - Corsi'">Corsi</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: nav('corsi')}"></div>
<div class="container">
    <div class="page-header">
        <h1>Corsi</h1>
        <a class="btn btn-primary" th:href="@{/corsi/nuovo}">+ Nuovo corso</a>
    </div>
    <div class="card">
        <table th:if="${not #lists.isEmpty(corsi)}">
            <thead>
            <tr><th>Nome</th><th>Stile</th><th>Livello</th><th>Istruttore</th><th>Sala</th><th>Orario</th><th>Prezzo/mese</th><th>Stato</th><th></th></tr>
            </thead>
            <tbody>
            <tr th:each="c : ${corsi}">
                <td><a th:href="@{/corsi/{id}(id=${c.id})}" th:text="${c.nome}"></a></td>
                <td th:text="${c.stile}"></td>
                <td th:text="${c.livello}"></td>
                <td th:text="${c.istruttoreNome} ?: '-'"></td>
                <td th:text="${c.salaNome} ?: '-'"></td>
                <td th:text="(${c.orarioInizio} != null ? ${c.orarioInizio} : '') + ' - ' + (${c.orarioFine} != null ? ${c.orarioFine} : '')"></td>
                <td th:text="${c.prezzoMensile} != null ? ('€ ' + ${#numbers.formatDecimal(c.prezzoMensile, 1, 2)}) : '-'"></td>
                <td><span class="badge" th:classappend="${c.attivo} ? 'badge-attivo' : 'badge-inattivo'" th:text="${c.attivo} ? 'Attivo' : 'Inattivo'"></span></td>
                <td class="actions-cell">
                    <a class="btn btn-dark btn-sm" th:href="@{/corsi/{id}/modifica(id=${c.id})}">Modifica</a>
                    <form th:action="@{/corsi/{id}/elimina(id=${c.id})}" method="post" onsubmit="return confirm('Eliminare questo corso?');">
                        <button type="submit" class="btn btn-primary btn-sm">Elimina</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
        <div class="empty-state" th:if="${#lists.isEmpty(corsi)}">Nessun corso registrato.</div>
    </div>
</div>
</body>
</html>
