<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${nomeScuola} + ' - Corso'">Corso</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: nav('corsi')}"></div>
<div class="container">
    <div class="page-header">
        <h1 th:text="${corso.id} != null ? 'Modifica corso' : 'Nuovo corso'">Corso</h1>
    </div>
    <div class="card">
        <form th:action="@{/corsi/salva}" th:object="${corso}" method="post">
            <input type="hidden" th:field="*{id}">
            <div class="detail-grid">
                <div class="form-group">
                    <label>Nome corso</label>
                    <input type="text" th:field="*{nome}" required>
                </div>
                <div class="form-group">
                    <label>Stile di ballo</label>
                    <select th:field="*{stile}" required>
                        <option th:each="s : ${stiliBallo}" th:value="${s}" th:text="${s}"></option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Livello</label>
                    <select th:field="*{livello}" required>
                        <option th:each="l : ${livelli}" th:value="${l}" th:text="${l}"></option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Istruttore</label>
                    <select th:field="*{istruttoreId}">
                        <option value="">-- nessuno --</option>
                        <option th:each="i : ${istruttori}" th:value="${i.id}" th:text="${i.nome + ' ' + i.cognome}"></option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Sala</label>
                    <select th:field="*{salaId}">
                        <option value="">-- nessuna --</option>
                        <option th:each="s : ${sale}" th:value="${s.id}" th:text="${s.nome}"></option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Orario inizio</label>
                    <input type="time" th:field="*{orarioInizio}">
                </div>
                <div class="form-group">
                    <label>Orario fine</label>
                    <input type="time" th:field="*{orarioFine}">
                </div>
                <div class="form-group">
                    <label>Capienza massima</label>
                    <input type="number" th:field="*{capienzaMax}">
                </div>
                <div class="form-group">
                    <label>Prezzo mensile (€)</label>
                    <input type="number" step="0.01" th:field="*{prezzoMensile}">
                </div>
                <div class="form-group">
                    <label>Data inizio</label>
                    <input type="date" th:field="*{dataInizio}">
                </div>
                <div class="form-group">
                    <label>Data fine</label>
                    <input type="date" th:field="*{dataFine}">
                </div>
            </div>
            <div class="form-group">
                <label>Giorni della settimana</label>
                <div class="checkbox-list">
                    <label th:each="g : ${giorni}">
                        <input type="checkbox" name="giorniSettimana" th:value="${g}" th:checked="${corso.giorniSettimana != null and corso.giorniSettimana.contains(g)}">
                        <span th:text="${g}"></span>
                    </label>
                </div>
            </div>
            <div class="form-group">
                <label><input type="checkbox" th:field="*{attivo}" style="width:auto;display:inline-block"> Corso attivo</label>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Salva</button>
                <a class="btn btn-outline" th:href="@{/corsi}">Annulla</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
