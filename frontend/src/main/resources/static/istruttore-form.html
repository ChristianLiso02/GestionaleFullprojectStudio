<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>FullProject Studio - Istruttore</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <div id="sidebar-container"></div>
    <div class="main">
      <div id="topbar-container"></div>
      <div class="content">
        <div id="errorBox" hidden></div>

        <div class="panel">
          <div class="panel-head"><h2 id="formTitle">Nuovo istruttore</h2></div>
          <form id="istruttoreForm" class="panel-body" style="padding:18px 20px" novalidate>
            <div class="row2">
              <div class="field"><label>Nome</label><input id="fNome" required></div>
              <div class="field"><label>Cognome</label><input id="fCognome" required></div>
            </div>
            <div class="row2">
              <div class="field"><label>Telefono</label><input id="fTelefono"></div>
              <div class="field"><label>Email</label><input id="fEmail" type="email"></div>
            </div>
            <div class="field"><label>Compenso orario (€)</label><input id="fCompenso" type="number" step="0.01"></div>
            <div class="field">
              <label>Specializzazioni</label>
              <div class="checkbox-list" id="specializzazioniContainer"></div>
            </div>
            <div class="field"><label><input type="checkbox" id="fAttivo" checked style="width:auto;display:inline-block"> Attivo</label></div>
            <div class="form-actions">
              <button type="submit" class="btn btn-accent">Salva</button>
              <a class="btn btn-ghost" href="istruttori.html">Annulla</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/helpers.js"></script>
  <script src="js/validators.js"></script>
  <script src="js/nav.js"></script>
  <script>
    requireAuth();
    renderNav("istruttori", "Istruttore", "Staff didattico");
  </script>
  <script src="js/istruttore-form.js"></script>
</body>
</html>
