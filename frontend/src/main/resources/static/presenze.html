<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>FullProject Studio - Presenze</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <div id="sidebar-container"></div>
    <div class="main">
      <div id="topbar-container"></div>
      <div class="content">
        <div id="errorBox" hidden></div>

        <div class="panel">
          <div class="panel-head">
            <h2>Registro presenze</h2>
            <div class="toolbar">
              <select id="corsoSelect"></select>
              <input type="date" id="dataInput">
            </div>
          </div>
          <div id="presenzeContainer" class="checklist"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/helpers.js"></script>
  <script src="js/nav.js"></script>
  <script>
    requireAuth();
    renderNav("presenze", "Presenze", "Appello per corso e data");
  </script>
  <script src="js/presenze.js"></script>
</body>
</html>
