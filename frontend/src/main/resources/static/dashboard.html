<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FullProject Studio - Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <div id="sidebar-container"></div>
    <div class="main">
      <div id="topbar-container"></div>
      <div class="content">
        <div id="errorBox" hidden></div>

        <div class="stat-grid" id="statGrid"></div>

        <div class="panel">
          <div class="panel-head">
            <h2>Quote scadute da verificare</h2>
            <a class="btn btn-ghost" href="quote.html">Tutte le quote</a>
          </div>
          <div class="nota-quote">Studenti attivi che non hanno rinnovato. Se hanno pagato, registra il pagamento; se hanno smesso di venire senza avvisare, segnali come ritirati.</div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Studente</th><th>Corso</th><th>Mesi scaduti</th><th>Ultimo pagamento</th><th></th></tr></thead>
              <tbody id="quoteScaduteBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/helpers.js"></script>
  <script src="js/nav.js"></script>
  <script>
    requireAuth();
    renderNav("dashboard", "Dashboard", "Panoramica della scuola");
  </script>
  <script src="js/dashboard.js"></script>
</body>
</html>
