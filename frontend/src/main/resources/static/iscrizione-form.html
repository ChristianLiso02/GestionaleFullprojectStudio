<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>FullProject Studio - Iscrizione</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <div id="sidebar-container"></div>
    <div class="main">
      <div id="topbar-container"></div>
      <div class="content">
        <div id="errorBox" hidden></div>

        <div class="panel">
          <div class="panel-head"><h2 id="formTitle">Nuova iscrizione</h2></div>
          <form id="iscrizioneForm" class="panel-body" style="padding:18px 20px" novalidate>
            <div class="field"><label>Studente</label><select id="fStudente" required><option value="">-- seleziona --</option></select></div>
            <div class="field"><label>Corso</label><select id="fCorso" required><option value="">-- seleziona --</option></select></div>
            <div class="field"><label>Tipo abbonamento</label><select id="fAbbonamento"><option value="">-- nessuno --</option></select></div>
            <div class="row2">
              <div class="field"><label>Data iscrizione</label><input id="fDataIscr" type="date"></div>
              <div class="field"><label>Data scadenza</label><input id="fDataScad" type="date"></div>
            </div>
            <div class="field"><label>Stato</label><select id="fStato"></select></div>
            <div class="field"><label>Note</label><textarea id="fNote" rows="2"></textarea></div>
            <div style="display:flex;gap:10px;margin-top:10px">
              <button type="submit" class="btn btn-accent">Salva</button>
              <a class="btn btn-ghost" href="iscrizioni.html">Annulla</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/helpers.js"></script>
  <script src="js/nav.js"></script>
  <script>
    requireAuth();
    renderNav("iscrizioni", "Iscrizione", "Studenti collegati ai corsi");
  </script>
  <script src="js/iscrizione-form.js"></script>
</body>
</html>
