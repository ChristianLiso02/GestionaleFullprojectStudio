<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>FullProject Studio - Pagamento</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <div id="sidebar-container"></div>
    <div class="main">
      <div id="topbar-container"></div>
      <div class="content">
        <div id="errorBox" hidden></div>

        <div class="panel">
          <div class="panel-head"><h2 id="formTitle">Nuovo pagamento</h2></div>
          <form id="pagamentoForm" class="panel-body" style="padding:18px 20px" novalidate>
            <div class="field"><label>Studente</label><select id="fStudente" required><option value="">-- seleziona --</option></select></div>
            <div class="field"><label>Iscrizione collegata</label><select id="fIscrizione" disabled><option value="">-- seleziona prima uno studente --</option></select></div>
            <div class="row2">
              <div class="field"><label>Importo (€)</label><input id="fImporto" type="number" step="0.01" required></div>
              <div class="field"><label>Data pagamento</label><input id="fData" type="date"></div>
            </div>
            <div class="row2">
              <div class="field"><label>Mese di riferimento</label><input id="fMese" type="month" required></div>
              <div class="field">
                <label>Mesi coperti</label>
                <select id="fMesi">
                  <option value="1">1 mese (mensile)</option>
                  <option value="3">3 mesi (trimestrale)</option>
                </select>
              </div>
            </div>
            <div class="field"><label>Metodo</label><select id="fMetodo"></select></div>
            <div class="avviso" id="avvisoStato" hidden></div>
            <div class="field"><label>Causale</label><input id="fCausale" placeholder="es. Quota mensile Salsa Cubana"></div>
            <div class="field"><label>Note</label><textarea id="fNote" rows="2"></textarea></div>
            <div class="form-actions">
              <button type="submit" class="btn btn-accent">Salva</button>
              <a class="btn btn-ghost" id="linkAnnulla" href="pagamenti.html">Annulla</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/helpers.js"></script>
  <script src="js/nav.js"></script>
  <script>
    requireAuth();
    renderNav("pagamenti", "Pagamento", "Incassi e quote");
  </script>
  <script src="js/pagamento-form.js"></script>
</body>
</html>
