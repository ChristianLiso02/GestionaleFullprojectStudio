<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>FullProject Studio - Iscrizioni</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <div id="sidebar-container"></div>
    <div class="main">
      <div id="topbar-container"></div>
      <div class="content">
        <div id="errorBox" hidden></div>

        <div class="panel">
          <div class="panel-head">
            <h2>Iscrizioni</h2>
            <button class="btn btn-accent" onclick="nuovaIscrizione()">+ Nuova iscrizione</button>
          </div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Studente</th><th>Corso</th><th>Abbonamento</th><th>Dal</th><th>Scadenza</th><th>Stato</th><th></th></tr></thead>
              <tbody id="iscrizioniBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <div class="modal">
      <div class="modal-head"><h3 id="modalTitle">Nuova iscrizione</h3><button class="btn btn-ghost btn-sm" onclick="closeModal()">&#10005;</button></div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-foot">
        <button class="btn btn-ghost" onclick="closeModal()">Annulla</button>
        <button class="btn btn-accent" id="modalSave">Salva</button>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/helpers.js"></script>
  <script src="js/nav.js"></script>
  <script>
    requireAuth();
    renderNav("iscrizioni", "Iscrizioni", "Studenti collegati ai corsi");
  </script>
  <script src="js/iscrizioni.js"></script>
</body>
</html>
