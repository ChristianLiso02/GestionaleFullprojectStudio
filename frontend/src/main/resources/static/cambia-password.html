<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>FullProject Studio - Cambia password</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <div id="sidebar-container"></div>
    <div class="main">
      <div id="topbar-container"></div>
      <div class="content">
        <div id="errorBox" hidden></div>
        <div id="successBox" hidden style="background:var(--verde-soft);color:var(--verde);border-left:4px solid var(--verde);padding:10px 14px;border-radius:6px;margin-bottom:16px;font-size:0.88rem"></div>

        <div class="panel" style="max-width:460px">
          <div class="panel-head"><h2>Cambia password</h2></div>
          <form id="passwordForm" class="panel-body" style="padding:18px 20px" novalidate>
            <div class="field"><label>Password attuale</label><input id="fVecchia" type="password" required></div>
            <div class="field"><label>Nuova password</label><input id="fNuova" type="password" required minlength="8"></div>
            <div class="field"><label>Conferma nuova password</label><input id="fConferma" type="password" required minlength="8"></div>
            <div class="form-actions">
              <button type="submit" class="btn btn-accent">Salva nuova password</button>
              <a class="btn btn-ghost" href="dashboard.html">Annulla</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/helpers.js"></script>
  <script src="js/nav.js"></script>
  <script>
    requireAuth();
    renderNav("", "Cambia password", "Aggiorna le credenziali di accesso del tuo account");
  </script>
  <script src="js/cambia-password.js"></script>
</body>
</html>
