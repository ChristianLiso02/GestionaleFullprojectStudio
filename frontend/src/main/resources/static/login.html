<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FullProject Studio - Accesso</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <h1><span style="color:#141110">FullProject</span><span style="color:#c1121f">Studio</span></h1>
      <p class="subtitle">Gestionale interno &mdash; area segreteria</p>

      <div id="errorBox" hidden></div>

      <form id="loginForm">
        <div class="field">
          <label for="username">Nome utente</label>
          <input type="text" id="username" required autofocus>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" required>
        </div>
        <button type="submit" class="btn btn-accent" style="width:100%">Accedi</button>
      </form>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/helpers.js"></script>
  <script>
    if (isAuthenticated()) window.location.href = "dashboard.html";

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;
      try {
        const response = await fetch(API_BASE_URL + "/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password })
        });
        if (!response.ok) {
          if (response.status === 401) showError("Username o password non validi.");
          else if (response.status === 429) showError((await response.json()).message);
          else showError("Il gestionale ha risposto con un errore (" + response.status + "). Riprova tra poco; se continua, riavvia il PC.");
          return;
        }
        const data = await response.json();
        saveSession(data);
        window.location.href = "dashboard.html";
      } catch (err) {
        showError("Il gestionale non risponde. Chiudi il browser e riaprilo dall'icona FullProject Studio (o riavvia il PC). " +
          "Se hai usato una versione di prova, chiudila e svuota la cache del browser.");
      }
    });
  </script>
</body>
</html>
