<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>FullProject Studio - Quote mensili</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <div id="sidebar-container"></div>
    <div class="main">
      <div id="topbar-container"></div>
      <div class="content">
        <div id="errorBox" hidden></div>

        <div class="panel">
          <div class="panel-head">
            <h2 id="titoloMese">Quote mensili</h2>
            <div class="toolbar">
              <select id="stagioneSelect"></select>
              <input type="month" id="meseInput">
            </div>
          </div>
          <div class="riepilogo-quote" id="riepilogoQuote"></div>
          <div class="nota-quote" id="notaScadenza"></div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Studente</th><th>Corso</th><th>Quota</th><th>Scadenza</th><th>Stato</th><th>Pagamento</th><th></th></tr></thead>
              <tbody id="quoteBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/helpers.js"></script>
  <script src="js/nav.js"></script>
  <script>
    requireAuth();
    renderNav("quote", "Quote mensili", "Chi ha pagato la quota del mese e chi no");
  </script>
  <script src="js/quote.js"></script>
</body>
</html>
