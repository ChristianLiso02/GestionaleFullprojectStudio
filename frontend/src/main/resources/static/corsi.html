<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FullProject Studio - Corsi</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <div id="sidebar-container"></div>
    <div class="main">
      <div id="topbar-container"></div>
      <div class="content">
        <div id="errorBox" hidden></div>

        <div class="panel">
          <div class="panel-head">
            <h2>Corsi</h2>
            <div class="toolbar">
              <label class="filtro">Stagione <select id="stagioneSelect"></select></label>
              <a class="btn btn-accent" href="corso-form.html">+ Nuovo corso</a>
            </div>
          </div>
          <div class="riepilogo-sesso" id="riepilogoSesso" hidden></div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Corso</th><th>Istruttori</th><th>Sala</th><th>Giorni e orario</th><th>Posti</th><th>Uomini / Donne</th><th>Prezzo/mese</th><th><span class="sr-only">Azioni</span></th></tr></thead>
              <tbody id="corsiBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/helpers.js"></script>
  <script src="js/nav.js"></script>
  <script>
    requireAuth();
    renderNav("corsi", "Corsi", "Stili, livelli e orari");
  </script>
  <script src="js/corsi.js"></script>
</body>
</html>
