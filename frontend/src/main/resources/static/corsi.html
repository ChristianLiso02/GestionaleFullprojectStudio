<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>FullProject Studio - Corsi</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <div id="sidebar-container"></div>
    <div class="main">
      <div id="topbar-container"></div>
      <div class="content">
        <div id="errorBox" hidden></div>

        <div class="panel">
          <div class="panel-head">
            <h2>Corsi</h2>
            <div class="toolbar">
              <select id="stagioneSelect"></select>
              <a class="btn btn-accent" href="corso-form.html">+ Nuovo corso</a>
            </div>
          </div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Nome</th><th>Stile</th><th>Livello</th><th>Istruttore</th><th>Sala</th><th>Orario</th><th>Prezzo/mese</th><th>Stato</th><th></th></tr></thead>
              <tbody id="corsiBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/helpers.js"></script>
  <script src="js/nav.js"></script>
  <script>
    requireAuth();
    renderNav("corsi", "Corsi", "Stili, livelli e orari");
  </script>
  <script src="js/corsi.js"></script>
</body>
</html>
