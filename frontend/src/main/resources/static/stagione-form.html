<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>FullProject Studio - Stagione</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <div id="sidebar-container"></div>
    <div class="main">
      <div id="topbar-container"></div>
      <div class="content">
        <div id="errorBox" hidden></div>

        <div class="panel">
          <div class="panel-head"><h2 id="formTitle">Nuova stagione</h2></div>
          <form id="stagioneForm" class="panel-body" style="padding:18px 20px" novalidate>
            <div class="field"><label>Nome</label><input id="fNome" placeholder="es. 2026/2027" required></div>
            <div class="row2">
              <div class="field"><label>Data inizio</label><input id="fDataInizio" type="date"></div>
              <div class="field"><label>Data fine</label><input id="fDataFine" type="date"></div>
            </div>
            <div class="field" id="campoCorrente"><label><input type="checkbox" id="fCorrente" checked style="width:auto;display:inline-block"> Rendi questa la stagione corrente</label></div>
            <div class="form-actions">
              <button type="submit" class="btn btn-accent">Salva</button>
              <a class="btn btn-ghost" href="stagioni.html">Annulla</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/helpers.js"></script>
  <script src="js/nav.js"></script>
  <script>
    requireAuth();
    renderNav("stagioni", "Stagione", "Organizza corsi e iscrizioni per anno");
  </script>
  <script src="js/stagione-form.js"></script>
</body>
</html>
