server:
  port: 8080

spring:
  application:
    name: fullprojectstudio-backend
  profiles:
    active: dev
  jackson:
    date-format: yyyy-MM-dd
    default-property-inclusion: non_null

app:
  jwt:
    secret: ${JWT_SECRET:cambiaQuestaChiaveSegretaInProduzioneFullProjectStudio2026!}
    expiration-ms: ${JWT_EXPIRATION_MS:28800000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8081}
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:FullProject2026!}
    email: ${ADMIN_EMAIL:admin@fullprojectstudio.it}
  segreteria:
    username: ${SEGRETERIA_USERNAME:segreteria}
    password: ${SEGRETERIA_PASSWORD:Segreteria2026!}
    email: ${SEGRETERIA_EMAIL:segreteria@fullprojectstudio.it}
  backup:
    dir: ${BACKUP_DIR:./backup}
    cron: ${BACKUP_CRON:0 0 2 * * *}
  pagamenti:
    # Giorno del mese entro cui va pagata la quota mensile
    giorno-scadenza: ${PAGAMENTI_GIORNO_SCADENZA:7}
    # Mesi consecutivi scaduti dopo i quali lo studente compare tra le quote da verificare (pagato o ritirato?)
    mesi-scaduti-da-verificare: ${PAGAMENTI_MESI_SCADUTI_DA_VERIFICARE:1}

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:file:./data/fullprojectstudio;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fullprojectstudio}
    username: ${DB_USERNAME:fullprojectstudio}
    password: ${DB_PASSWORD:fullprojectstudio}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
